name: PSScriptAnalyzer

on:
  workflow_call:
    inputs:
      psmoduleutils_version:
        description: Exact PSModuleUtils release used for analysis when use_local_psmoduleutils is false.
        required: false
        type: string
        default: '4.2.3'
      path:
        description: Source path to analyze.
        required: false
        type: string
        default: 'src'
      settings:
        description: Optional caller-relative settings path; defaults to the settings bundled with PSModuleUtils.
        required: false
        type: string
        default: ''
      use_local_psmoduleutils:
        description: Loads analyzer commands from the caller checkout when validating PSModuleUtils itself.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        env:
          PSMODULEUTILS_VERSION: ${{ inputs.psmoduleutils_version }}
          INPUT_PATH: ${{ inputs.path }}
          INPUT_SETTINGS: ${{ inputs.settings }}
          USE_LOCAL_PSMODULEUTILS: ${{ inputs.use_local_psmoduleutils }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:USE_LOCAL_PSMODULEUTILS -eq 'true') {
              $manifest = Import-PowerShellDataFile -Path 'src/PSModuleUtils.psd1'
              $scriptAnalyzerSpecification = $manifest.RequiredModules |
                  Where-Object { $_.ModuleName -eq 'PSScriptAnalyzer' } |
                  Select-Object -First 1
              if (-not $scriptAnalyzerSpecification) {
                  throw 'The source manifest must declare PSScriptAnalyzer.'
              }
              if (-not (Get-Module -ListAvailable -FullyQualifiedName $scriptAnalyzerSpecification)) {
                  Install-Module `
                      -Name 'PSScriptAnalyzer' `
                      -MinimumVersion $scriptAnalyzerSpecification.ModuleVersion `
                      -MaximumVersion $scriptAnalyzerSpecification.MaximumVersion `
                      -Scope CurrentUser `
                      -Force `
                      -ErrorAction Stop
              }
              Import-Module -FullyQualifiedName $scriptAnalyzerSpecification -ErrorAction Stop

              @(
                  'src/Private/Get-PSModuleAnalyzerSettingsPath.ps1'
                  'src/Private/Invoke-PSModuleAnalyzerCasingWorkaround.ps1'
                  'src/Public/Export-PSModuleAnalyzerSettings.ps1'
                  'src/Public/Invoke-PSModuleAnalyzer.ps1'
              ) | ForEach-Object { . $_ }
          }
          else {
              $moduleSpecification = @{
                  ModuleName      = 'PSModuleUtils'
                  RequiredVersion = [Version]$env:PSMODULEUTILS_VERSION
              }
              if (-not (Get-Module -ListAvailable -FullyQualifiedName $moduleSpecification)) {
                  Install-Module `
                      -Name 'PSModuleUtils' `
                      -RequiredVersion $moduleSpecification.RequiredVersion `
                      -Scope CurrentUser `
                      -Force `
                      -ErrorAction Stop
              }
              Import-Module -FullyQualifiedName $moduleSpecification -ErrorAction Stop
          }

          if (-not (Get-Module -ListAvailable -Name 'ConvertToSARIF')) {
              Install-Module -Name 'ConvertToSARIF' -Scope CurrentUser -Force -ErrorAction Stop
          }
          Import-Module -Name 'ConvertToSARIF' -ErrorAction Stop

          if ($env:INPUT_SETTINGS) {
              $settingsPath = $env:INPUT_SETTINGS
          }
          else {
              $settingsPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'PSScriptAnalyzerSettings.psd1'
              Export-PSModuleAnalyzerSettings -Path $settingsPath -Force
          }

          Invoke-PSModuleAnalyzer `
              -SourceDirectory $env:INPUT_PATH `
              -Settings $settingsPath |
              ConvertTo-SARIF -FilePath 'results.sarif'

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          token: ${{ secrets.GITHUB_TOKEN }}
