name: Workflow tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -ErrorAction Stop
      - name: Test dependency installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 6.2.0 -ErrorAction Stop
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './tests'
          $configuration.Run.Throw = $true
          $configuration.Run.PassThru = $true
          $result = Invoke-Pester -Configuration $configuration
          if ($result.PassedCount -eq 0) {
              throw 'No workflow tests passed.'
          }
